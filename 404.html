<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Sayfa Bulunamadı - Parnex</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/Muhasebe/icons/logo.svg">
    <link rel="apple-touch-icon" href="/Muhasebe/icons/logo-192.png">
    <style>
        :root{color-scheme:light dark;--bg:#f4f5fb;--surface:#fff;--text:#1e2235;--muted:#6e7190;--primary:#6d5dfc}
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
        .card{width:min(620px,100%);text-align:center;background:var(--surface);border:1px solid rgba(109,93,252,.14);border-radius:24px;padding:48px 28px;box-shadow:0 20px 60px rgba(30,34,53,.08)}
        img{width:72px;height:72px;margin-bottom:20px}.code{font-size:clamp(4rem,14vw,7rem);line-height:1;font-weight:800;letter-spacing:-.06em;color:var(--primary);margin:0}
        h1{font-size:1.7rem;margin:18px 0 10px}p{color:var(--muted);font-size:1rem;line-height:1.7;margin:0 auto 28px;max-width:460px}
        .links{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:12px;text-decoration:none;font-weight:700}
        .primary{background:var(--primary);color:#fff}.secondary{border:1px solid #ddd;color:var(--text)}
        @media(prefers-color-scheme:dark){:root{--bg:#11121d;--surface:#191a29;--text:#f4f5fb;--muted:#a7aac0}.secondary{border-color:#37384a}}
    </style>
</head>
<body>
    <main class="card">
        <img src="/Muhasebe/icons/logo-192.png" alt="Parnex logosu" width="72" height="72">
        <p class="code" aria-hidden="true">404</p>
        <h1>Sayfa bulunamadı</h1>
        <p>Aradığınız sayfa taşınmış, silinmiş veya adresi yanlış yazılmış olabilir.</p>
        <div class="links">
            <a class="btn primary" href="/Muhasebe/">Parnex ana sayfa</a>
            <a class="btn secondary" href="/Muhasebe/butce/">Bütçe takibi</a>
        </div>
    </main>
</body>
</html>
