name: Android APK
# Parnex production debug build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Prepare Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
          else
            echo "::error::GOOGLE_SERVICES_JSON secret veya kökte google-services.json bulunamadı. Native FCM çalışmaz."
            exit 1
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply Parnex adaptive launcher icon
        run: |
          set -e
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          curl -L --fail --retry 3 https://raw.githubusercontent.com/Bizzness4711/Notion_parnex/main/icons/logo-512.png -o /tmp/parnex_logo.png
          # Keep the exact Parnex logo for legacy Android launchers.
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp /tmp/parnex_logo.png "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp /tmp/parnex_logo.png "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
          cat > android/app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="64"
              android:viewportHeight="64">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M17,47V17h16c9,0 14,4.5 14,11.6s-5,11.6 -14,11.6H27V47H17zM27,31.9h5.5c3,0 4.8,-1.2 4.8,-3.3s-1.8,-3.3 -4.8,-3.3H27v6.6z"/>
              <path
                  android:fillColor="@android:color/transparent"
                  android:pathData="M37,48l6,-6 4,4 7,-9"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="4"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"/>
          </vector>
          EOF
          cat > android/app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#6D5DFC" android:endColor="#A855F7" android:angle="135"/>
          </shape>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = re.sub(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', text, count=1)
          if 'android:roundIcon=' in text:
              text = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', text, count=1)
          else:
              text = text.replace('<application ', '<application android:roundIcon="@mipmap/ic_launcher_round" ', 1)
          metadata = '\n        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_parnex" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/parnex_notification_color" />'
          if 'com.google.firebase.messaging.default_notification_icon' not in text:
              text = text.replace('</application>', metadata + '\n    </application>', 1)
          manifest.write_text(text)
          PY
          cat > android/app/src/main/res/drawable/ic_stat_parnex.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M4,19V5h8c4.2,0 6.5,2.1 6.5,5.5S16.2,16 12,16H9v3H4zM9,12.8h2.5c1.7,0 2.7,-0.8 2.7,-2.3s-1,-2.3 -2.7,-2.3H9v4.6z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M14.5,18.5l2.4,-2.4 1.6,1.6 2.5,-3.1 1.2,1 -3.7,4.6 -1.6,-1.6 -1.5,1.5z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/values/parnex-notification.xml <<'EOF'
          <resources><color name="parnex_notification_color">#6D5DFC</color></resources>
          EOF

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parnex-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
