# Saatlik push hatırlatıcı: tools/push/send.js çalıştırır.
# Gereksinim: repo secret'ı FIREBASE_SERVICE_ACCOUNT (Firebase service account JSON'u, tek satır).
# Kurulum: GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret
name: Push reminders

on:
  schedule:
    - cron: '17 * * * *' # her saat 17. dakika (GitHub, saat başı yük zirvesinde
                          # ertelenen/düşen scheduled koşuları farklı dakikaya almayı önerir)
  workflow_dispatch: # manuel tetikleme butonu

# Job'ın çalışması için gereken en düşük izin: depoyu checkout etmek (yazma yok).
permissions:
  contents: read

# Zamanlanmış ve manuel koşular asla eşzamanlı çalışmasın: eşzamanlı iki koşu
# aynı pushLog adayını (isLogged okuma → gönderim → commit arası) iki kez
# gönderebilir. cancel-in-progress: false → çalışan iş yarıda kesilmez.
concurrency:
  group: push-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: npm install firebase-admin@12 --no-save

      - name: Push gönder
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/push/send.js
