<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Parnex</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #11121d; color: #f4f5fb; }
        .box { text-align: center; padding: 24px; }
        h1 { font-size: 1.4rem; margin: 16px 0 8px; }
        p { color: #a7aac0; margin: 0 0 20px; }
        button { background: #6d5dfc; color: #fff; border: 0; padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Parnex'e bağlanılamadı</h1>
        <p>İnternet bağlantınızı kontrol edip tekrar deneyin.</p>
        <button onclick="location.reload()">Tekrar dene</button>
    </div>
</body>
</html>
