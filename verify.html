<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-posta Doğrulama - Parnex</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="icons/logo.svg">
    <style>
        :root { color-scheme: light dark; --bg: #f4f5fb; --surface: #fff; --text: #1e2235; --muted: #6e7190; --primary: #6d5dfc; --ok: #159a72; --err: #d95768; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
        .card { width: min(480px, 100%); text-align: center; background: var(--surface); border: 1px solid rgba(109, 93, 252, .14); border-radius: 24px; padding: 48px 28px; box-shadow: 0 20px 60px rgba(30, 34, 53, .08); }
        .icon { width: 72px; height: 72px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(109, 93, 252, .12); margin-bottom: 20px; }
        .icon svg { width: 36px; height: 36px; }
        h1 { font-size: 1.5rem; margin: 0 0 10px; }
        p { color: var(--muted); font-size: 0.95rem; line-height: 1.6; margin: 0 0 22px; }
        .status { font-weight: 700; }
        .status.ok { color: var(--ok); }
        .status.err { color: var(--err); }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(109, 93, 252, .2); border-top-color: var(--primary); border-radius: 50%; margin: 0 auto 20px; animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn { display: inline-block; padding: 12px 28px; border-radius: 12px; background: var(--primary); color: #fff; text-decoration: none; font-weight: 700; transition: opacity .2s; }
        .btn:hover { opacity: .9; }
        .reset-form { display: none; flex-direction: column; gap: 14px; margin-top: 6px; }
        .reset-form.show { display: flex; }
        .reset-form input { padding: 12px 14px; border-radius: 12px; border: 1.5px solid rgba(109,93,252,.25); font-size: 1rem; background: var(--bg); color: var(--text); }
        .reset-form input:focus { outline: none; border-color: var(--primary); }
        .reset-form button { padding: 12px; border: 0; border-radius: 12px; background: var(--primary); color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; }
        @media (prefers-color-scheme: dark) { :root { --bg: #11121d; --surface: #191a29; --text: #f4f5fb; --muted: #a7aac0; } }
    </style>
</head>
<body>
    <main class="card">
        <div id="spinner" class="spinner" role="status" aria-label="Yükleniyor"></div>
        <h1 id="cardTitle">E-posta doğrulama</h1>
        <p id="message">Doğrulama işleniyor…</p>
        <div id="resetForm" class="reset-form">
            <input type="password" id="newPassword" minlength="6" placeholder="Yeni şifre (en az 6 karakter)" autocomplete="new-password">
            <input type="password" id="newPassword2" minlength="6" placeholder="Yeni şifre (tekrar)" autocomplete="new-password">
            <button id="resetSubmitBtn" type="button">Şifreyi Güncelle</button>
        </div>
        <a id="continueBtn" class="btn" href="/" hidden>Parnex'i Aç</a>
    </main>

    <script type="module">
        // Firebase Auth compat SDK (index.html ile ayni surum), modul olarak import edilir.
        import 'https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js';
        import 'https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDc5VzYalm9J39uHHNNpVgVA_FZolKOMQM",
            authDomain: "parnex-97d1b.firebaseapp.com",
            projectId: "parnex-97d1b",
            storageBucket: "parnex-97d1b.firebasestorage.app",
            messagingSenderId: "909377657628",
            appId: "1:909377657628:web:44192bd16b27046834b8d9"
        };

        const msgEl = document.getElementById('message');
        const spinner = document.getElementById('spinner');
        const continueBtn = document.getElementById('continueBtn');

        function done(html, ok) {
            spinner.hidden = true;
            msgEl.innerHTML = html;
            msgEl.classList.add('status', ok ? 'ok' : 'err');
            continueBtn.hidden = false;
            continueBtn.textContent = ok ? "Parnex'i Aç" : 'Parnex\'e Dön';
        }

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const params = new URLSearchParams(location.search);
        const mode = params.get('mode');
        const oobCode = params.get('oobCode');

        if (mode === 'verifyEmail' && oobCode) {
            auth.applyActionCode(oobCode)
                .then(() => done('E-postanız başarıyla doğrulandı! 🎉<br>Uygulamaya dönüp giriş yapabilirsiniz.', true))
                .catch((e) => {
                    console.warn(e);
                    done('Link geçersiz veya daha önce kullanılmış.<br>Uygulamadan yeni bir doğrulama e-postası talep edin.', false);
                });
        } else if (mode === 'resetPassword' && oobCode) {
            // Şifre sıfırlama: kodu doğrula, yeni şifre formu göster.
            document.getElementById('cardTitle').textContent = 'Yeni şifre belirle';
            msgEl.textContent = 'Hesabınız için yeni bir şifre belirleyin.';
            msgEl.classList.remove('status');
            const form = document.getElementById('resetForm');
            form.classList.add('show');
            spinner.hidden = true;
            document.getElementById('resetSubmitBtn').onclick = async () => {
                const p1 = document.getElementById('newPassword').value;
                const p2 = document.getElementById('newPassword2').value;
                if (p1.length < 6) { msgEl.textContent = 'Şifre en az 6 karakter olmalı.'; msgEl.classList.add('status','err'); return; }
                if (p1 !== p2) { msgEl.textContent = 'Şifreler eşleşmiyor.'; msgEl.classList.add('status','err'); return; }
                try {
                    await auth.confirmPasswordReset(oobCode, p1);
                    form.classList.remove('show');
                    done('Şifreniz güncellendi! Yeni şifreyle giriş yapabilirsiniz.', true);
                } catch (e) {
                    console.warn(e);
                    msgEl.textContent = 'Şifre güncellenemedi: link geçersiz olabilir. Uygulamadan tekrar talep edin.';
                    msgEl.classList.add('status','err');
                }
            };
        } else {
            done('Bu sayfa e-posta doğrulama linkleri içindir.', false);
        }
    </script>
</body>
</html>
